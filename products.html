<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ShopNest | Products</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- External CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold"
           href="index.html">

            Shop<span>Nest</span>

        </a>


        <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav">

            <span class="navbar-toggler-icon"></span>

        </button>


        <div class="collapse navbar-collapse"
             id="mainNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link"
                       href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active"
                       href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="about.html">
                        About Us
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       href="contact.html">
                        Contact
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- Breadcrumb -->
<section class="page-header">

    <div class="container">

        <nav aria-label="breadcrumb">

            <ol class="breadcrumb">

                <li class="breadcrumb-item">
                    <a href="index.html">
                        Home
                    </a>
                </li>

                <li class="breadcrumb-item active">
                    Products
                </li>

            </ol>

        </nav>

        <h1>
            Products / Portfolio
        </h1>

        <p class="text-secondary mb-0">
            Browse our product collection.
        </p>

    </div>

</section>


<!-- Products -->
<section class="py-5">

    <div class="container">

        <div class="row g-4">


            <!-- LEFT PANEL -->
            <aside class="col-lg-3">

                <div class="filter-panel">

                    <h5>
                        Product Categories
                    </h5>


                    <button class="category-filter active"
                            data-category="All">

                        All Products

                    </button>


                    <button class="category-filter"
                            data-category="Fashion">

                        Fashion

                    </button>


                    <button class="category-filter"
                            data-category="Electronics">

                        Electronics

                    </button>


                    <button class="category-filter"
                            data-category="Accessories">

                        Accessories

                    </button>


                    <button class="category-filter"
                            data-category="Home">

                        Home

                    </button>

                </div>

            </aside>


            <!-- RIGHT PANEL -->
            <main class="col-lg-9">

                <div class="d-flex justify-content-between
                            align-items-center mb-3">

                    <h3>
                        Product Collection
                    </h3>

                    <span id="resultCount"
                          class="text-secondary">
                    </span>

                </div>


                <!-- Bootstrap Cards -->
                <div id="productGrid"
                     class="row g-4">
                </div>


                <!-- Pagination -->
                <nav class="mt-5">

                    <ul id="pagination"
                        class="pagination justify-content-center">

                    </ul>

                </nav>

            </main>

        </div>

    </div>

</section>


<!-- Footer -->
<footer class="footer">

    <div class="container py-4 text-center">

        <h5>
            ShopNest
        </h5>

        <p class="mb-0">
            © 2026 ShopNest
        </p>

    </div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/script.js"></script>

<script>
    initProductsPage();
</script>

</body>
</html>
